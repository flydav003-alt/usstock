name: Grok Elite Swing

on:
  schedule:
  - cron: '17 02 * * 2-6'
  workflow_dispatch:

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests plotly lxml beautifulsoup4 ta requests-cache

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
          PAGES_URL:          ${{ secrets.PAGES_URL }}
        run: python grok_elite_swing.py

      - name: Push CSV to Taiwan Repo
        run: |
          CSV_FILE=$(ls us_*.csv 2>/dev/null | head -1)
          if [ -z "$CSV_FILE" ]; then
            echo "❌ 找不到 CSV，跳過"
            exit 1
          fi
          echo "✅ 找到 CSV：$CSV_FILE"

          git clone https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/flydav003-alt/BT.git target_repo
          cp "$CSV_FILE" target_repo/data/input/

          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/input/"$CSV_FILE"
          git diff --staged --quiet && echo "⏭️ 無變更，跳過" && exit 0
          git commit -m "🔄 更新美股 CSV：$CSV_FILE [skip ci]"
          git push

      - name: Notify Taiwan Repo
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.TARGET_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/flydav003-alt/BT/dispatches \
            -d '{"event_type":"csv-us-updated"}'

      - name: Update GitHub Pages
        run: |
          HTML_FILE=$(ls Grok_Elite_Swing_Report_*.html 2>/dev/null | head -1)
          if [ -n "$HTML_FILE" ]; then
            mkdir -p docs
            cp "$HTML_FILE" docs/index.html
          fi

      - name: Update Web and Clean History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 處理網頁檔案：確保 docs 存在，並將今日報表轉為 index.html
          mkdir -p docs
          HTML_FILE=$(ls Grok_Elite_Swing_Report_*.html 2>/dev/null | head -1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" docs/index.html
          fi

          # 2. 徹底清理：從 GitHub 紀錄中移除所有具備日期檔名的 CSV 和 HTML
          git rm Grok_Elite_Swing_*.csv || true
          git rm Grok_Elite_Swing_Report_*.html || true

          # 3. 唯獨加回 index.html，確保網頁佈告欄有東西顯示
          git add docs/index.html

          # 4. 提交與推送
          git diff --staged --quiet || git commit -m "Update Daily Report & Auto Clean"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
